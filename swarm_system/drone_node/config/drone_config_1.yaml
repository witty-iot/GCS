# Demo config for drone 1 (SITL instance -I 0, radarku/ardupilot-sitl amd64
# image). The container's TCP port 5760 only serves ONE client, so a host
# -side mavlink_relay.py process owns that connection and fans it out over
# UDP on 14540 (this) and 14550 (Mission Planner/QGC).
hardware_id: jetson-01

broker:
  host: localhost
  port: 1883
  connect_timeout_sec: 5
  register_timeout_sec: 10

drone:
  connection_string: "udpin://0.0.0.0:14540"
  # Must be unique per drone process running on this laptop (see
  # drone_agent.py's mavsdk_server_port comment) — irrelevant once each
  # drone has its own physical Jetson.
  mavsdk_server_port: 50051

fallback_mission: "../missions/standalone_mission.xml"

# Local hardware wiring — never part of the mission XML, never sent over
# the network. main.py reads this to build a SprayController and expose
# it to action plugins (spray_on.py/spray_off.py) as drone_context["spray"].
hardware:
  spray:
    gpio_pin: 18
    pump_on_delay_ms: 200
    pump_off_delay_ms: 300
